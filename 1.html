<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>タブ式ペンメモ</title>

  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background: #f3f4f6;
      height: 100vh;
      overflow: hidden;
    }

    .app {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    .tabs {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #e5e7eb;
      padding: 10px;
      overflow-x: auto;
    }

    .tab {
      background: white;
      padding: 10px 16px;
      border-radius: 12px 12px 0 0;
      cursor: pointer;
      white-space: nowrap;
      border: 2px solid transparent;
      display: flex;
      align-items: center;
    }

    .tab.active {
      border-color: black;
      font-weight: bold;
    }

    .tab .close {
      margin-left: 8px;
      color: red;
      cursor: pointer;
      font-weight: bold;
    }

    .add-tab {
      font-size: 20px;
      width: 40px;
      height: 40px;
      border-radius: 12px;
      border: none;
      background: black;
      color: white;
      cursor: pointer;
    }

    .toolbar {
      display: flex;
      gap: 12px;
      align-items: center;
      padding: 12px;
      background: white;
      border-bottom: 1px solid #ddd;
      flex-wrap: wrap;
    }

    button {
      padding: 10px 16px;
      border: none;
      border-radius: 12px;
      background: black;
      color: white;
      cursor: pointer;
    }

    label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
    }

    canvas {
      flex: 1;
      width: 100%;
      background: white;
      touch-action: none;
    }

    .locked {
      opacity: 0.5;
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="tabs" id="tabs"></div>

    <div class="toolbar">
      <input type="color" id="colorPicker" value="#000000">

      <label>
        ペンサイズ
        <input type="range" id="sizePicker" min="1" max="20" value="3">
      </label>

      <button onclick="toggleEraser()" id="eraserBtn">
        消しゴムOFF
      </button>

      <label>
        消しゴムサイズ
        <input type="range"
               id="eraserSizePicker"
               min="5"
               max="80"
               value="20">
      </label>

      <button onclick="clearCanvas()">クリア</button>
      <button onclick="saveImage()">保存</button>
      <button onclick="toggleLock()" id="lockBtn">ロックOFF</button>
    </div>

    <canvas id="canvas"></canvas>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const tabsEl = document.getElementById('tabs');

    const colorPicker = document.getElementById('colorPicker');
    const sizePicker = document.getElementById('sizePicker');
    const eraserSizePicker =
      document.getElementById('eraserSizePicker');

    const lockBtn = document.getElementById('lockBtn');
    const eraserBtn = document.getElementById('eraserBtn');

    function resizeCanvas() {
      const temp = canvas.toDataURL();

      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight - 120;

      const img = new Image();

      img.onload = () => {
        ctx.drawImage(img, 0, 0);
      };

      img.src = temp;
    }

    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    let drawing = false;
    let locked = false;
    let erasing = false;

    let penSize = 3;
    let eraserSize = 20;

    let tabs = [];
    let activeTab = 0;

    function saveTabsToStorage() {
      if (tabs.length > 0) {
        tabs[activeTab].image = canvas.toDataURL();
      }

      localStorage.setItem('penMemoTabs', JSON.stringify(tabs));
      localStorage.setItem('penMemoActiveTab', activeTab);
    }

    function loadTabsFromStorage() {
      const savedTabs = localStorage.getItem('penMemoTabs');
      const savedActive = localStorage.getItem('penMemoActiveTab');

      if (savedTabs) {
        tabs = JSON.parse(savedTabs);
        activeTab = savedActive ? Number(savedActive) : 0;

        renderTabs();
        loadTabImage(activeTab);
      } else {
        createTab();
      }
    }

    sizePicker.addEventListener('input', () => {
      penSize = Number(sizePicker.value);
    });

    eraserSizePicker.addEventListener('input', () => {
      eraserSize = Number(eraserSizePicker.value);
    });

    function createTab(name = null) {
      if (tabs.length > 0) {
        tabs[activeTab].image = canvas.toDataURL();
      }

      tabs.push({
        title: name || `メモ ${tabs.length + 1}`,
        image: null,
      });

      activeTab = tabs.length - 1;

      renderTabs();
      clearCanvas(true);
      saveTabsToStorage();
    }

    // ★追加：タブ削除
    function closeTab(index) {
      if (tabs.length === 1) return;

      tabs.splice(index, 1);

      if (activeTab >= tabs.length) {
        activeTab = tabs.length - 1;
      } else if (activeTab === index) {
        activeTab = Math.max(0, index - 1);
      }

      loadTabImage(activeTab);
      renderTabs();
      saveTabsToStorage();
    }

    function renderTabs() {
      tabsEl.innerHTML = '';

      tabs.forEach((tab, index) => {
        const el = document.createElement('div');
        el.className = 'tab ' + (index === activeTab ? 'active' : '');

        el.onclick = () => switchTab(index);

        const title = document.createElement('span');
        title.textContent = tab.title;

        const close = document.createElement('span');
        close.textContent = '×';
        close.className = 'close';

        close.onclick = (e) => {
          e.stopPropagation();
          closeTab(index);
        };

        el.appendChild(title);
        el.appendChild(close);

        tabsEl.appendChild(el);
      });

      const addBtn = document.createElement('button');
      addBtn.className = 'add-tab';
      addBtn.textContent = '+';
      addBtn.onclick = () => createTab();

      tabsEl.appendChild(addBtn);
    }

    function loadTabImage(index) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (tabs[index].image) {
        const img = new Image();
        img.onload = () => ctx.drawImage(img, 0, 0);
        img.src = tabs[index].image;
      }
    }

    function switchTab(index) {
      tabs[activeTab].image = canvas.toDataURL();
      activeTab = index;

      renderTabs();
      loadTabImage(index);
      saveTabsToStorage();
    }

    function getPos(e) {
      const rect = canvas.getBoundingClientRect();

      if (e.touches) {
        return {
          x: e.touches[0].clientX - rect.left,
          y: e.touches[0].clientY - rect.top,
        };
      }

      return {
        x: e.clientX - rect.left,
        y: e.clientY - rect.top,
      };
    }

    function startDraw(e) {
      if (locked) return;

      drawing = true;

      const pos = getPos(e);
      ctx.beginPath();
      ctx.moveTo(pos.x, pos.y);
    }

    function draw(e) {
      if (!drawing || locked) return;

      const pos = getPos(e);

      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      if (erasing) {
        ctx.globalCompositeOperation = 'destination-out';
        ctx.lineWidth = eraserSize;
      } else {
        ctx.globalCompositeOperation = 'source-over';
        ctx.strokeStyle = colorPicker.value;
        ctx.lineWidth = penSize;
      }

      ctx.lineTo(pos.x, pos.y);
      ctx.stroke();
    }

    function stopDraw() {
      if (!drawing) return;

      drawing = false;
      ctx.beginPath();
      saveTabsToStorage();
    }

    function clearCanvas(skipSave = false) {
      if (locked) return;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (!skipSave) {
        tabs[activeTab].image = null;
        saveTabsToStorage();
      }
    }

    function saveImage() {
      const link = document.createElement('a');
      link.download = tabs[activeTab].title + '.png';
      link.href = canvas.toDataURL();
      link.click();
    }

    function toggleLock() {
      locked = !locked;

      lockBtn.textContent = locked ? 'ロックON' : 'ロックOFF';

      if (locked) {
        canvas.classList.add('locked');
      } else {
        canvas.classList.remove('locked');
      }
    }

    function toggleEraser() {
      erasing = !erasing;
      eraserBtn.textContent = erasing ? '消しゴムON' : '消しゴムOFF';
    }

    canvas.addEventListener('mousedown', startDraw);
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('mouseup', stopDraw);
    canvas.addEventListener('mouseleave', stopDraw);

    canvas.addEventListener('touchstart', startDraw);
    canvas.addEventListener('touchmove', draw);
    canvas.addEventListener('touchend', stopDraw);

    loadTabsFromStorage();
  </script>
</body>
</html>
